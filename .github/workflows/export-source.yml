name: Export branch source

on:
  push:
    branches:
      - agent/olympus-vs-otherworld
    paths:
      - .github/workflows/export-source.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/upload-artifact@v4
        with:
          name: branch-source
          path: .
          include-hidden-files: true
          retention-days: 1
