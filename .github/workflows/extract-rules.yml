name: Extract rules PDF

on:
  push:
    branches:
      - agent/bootstrap-expert-seeded-strategy-lab
    paths:
      - .github/workflows/extract-rules.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  extract:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout research branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Fetch PDF from main
        run: |
          git fetch origin main
          git show "origin/main:规则手册2.0.pdf" > /tmp/rules.pdf
          test -s /tmp/rules.pdf

      - name: Install PDF tooling
        run: python -m pip install --upgrade pypdf pypdfium2

      - name: Extract text and render pages
        run: |
          mkdir -p /tmp/rules-artifact/pages
          python - <<'PY'
          from pathlib import Path
          from pypdf import PdfReader
          import pypdfium2 as pdfium

          pdf_path = Path('/tmp/rules.pdf')
          out = Path('/tmp/rules-artifact')

          reader = PdfReader(str(pdf_path))
          chunks = []
          for index, page in enumerate(reader.pages, start=1):
              text = page.extract_text() or ''
              chunks.append(f'\n\n===== PAGE {index} =====\n\n{text}')
          (out / '规则手册2.0.txt').write_text(''.join(chunks), encoding='utf-8')

          pdf = pdfium.PdfDocument(str(pdf_path))
          for index in range(len(pdf)):
              page = pdf[index]
              image = page.render(scale=2.0).to_pil()
              image.save(out / 'pages' / f'page-{index + 1:03d}.png')
          print(f'pages={len(pdf)}')
          PY

      - name: Upload extracted rules
        uses: actions/upload-artifact@v4
        with:
          name: rules-pdf-extracted
          path: /tmp/rules-artifact
          if-no-files-found: error
          retention-days: 7
